<div class="author-list-container">
  <h1>Authors 👥</h1>
  <ul class="authors-list">
    <li *ngFor="let author of authors" class="author-item">
      <span class="author-name">{{ author.name }}</span>
      <a [routerLink]="['/authors', author.id]" class="btn-detail">View Details</a>
    </li>
  </ul>
</div>
